# Ruff linter and formatter configuration
target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[lint.per-file-ignores]
"eval/*" = ["E402"]
"backend/tests/**" = ["E402"]
"tests/**" = ["E402"]

[lint.isort]
known-first-party = ["app", "ground_truth", "run_eval"]

[format]
quote-style = "double"
indent-style = "space"
