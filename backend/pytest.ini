[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Unit tests verifying isolated components without DB or network dependencies
    integration: Integration tests against live database or services
    security: Security policy and AST injection prevention tests
    evaluation: LLM accuracy and benchmark evaluation suites
    live: Live external LLM API tests requiring valid API key
