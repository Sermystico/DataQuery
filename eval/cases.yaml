# DataQuery Analytical Evaluation Test Suite
# Contains 52 rigorous test cases:
# - 32 Correctness Cases (computed independently in Python using seed dataset)
# - 14 Security & Adversarial Cases (SQL validation, permission invariants, prompt injection)
# - 6 Failure & Resilience Cases (LLM unavailable, garbage SQL, timeouts, explanation failure)

version: "1.0"
metadata:
  total_cases: 52
  tolerance: 0.01

