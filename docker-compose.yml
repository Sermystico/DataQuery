# ==============================================================================
# DataQuery Production Docker Compose Configuration
# Services: Database (PostgreSQL 16), Backend (FastAPI), Frontend (Nginx)
# ==============================================================================

services:
  db:
    image: postgres:16
    container_name: dataquery-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataquery_dev}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-dq_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-dq_owner_dev_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-dq_owner} -d ${POSTGRES_DB:-dataquery_dev}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataquery-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dataquery_dev}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-dq_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-dq_owner_dev_pw}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-dq_readonly}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-dq_readonly_dev_pw}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-dq_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-dq_app_dev_pw}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-3-5-sonnet-20241022}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      ANALYTICS_AS_OF_DATE: ${ANALYTICS_AS_OF_DATE:-2024-11-01T00:00:00Z}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-3000}
      MAX_RESULT_ROWS: ${MAX_RESULT_ROWS:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dataquery-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
